<script>
        function tryNextExt(imgEl, exts) {
            if (!imgEl.dataset.extIndex) imgEl.dataset.extIndex = "0";
            let idx = parseInt(imgEl.dataset.extIndex);
            if (idx < exts.length) {
                imgEl.src = exts[idx];
                imgEl.dataset.extIndex = (idx + 1).toString();
            } else {
                imgEl.onerror = null;
            }
        }

        const bgAudio = document.getElementById('bgMusic');
        bgAudio.volume = 1.0;

        const sfx = {
            correct: new Audio('correct.mp3'),
            wrong: new Audio('wrong.mp3'),
            spin: new Audio('spin.mp3')
        };

        let isMuted = false;

        bgAudio.addEventListener('error', () => {
            console.warn("تعذر العثور على الملف تلقائياً.");
            document.getElementById('filePickerLabel').classList.remove('hidden');
        });

        function playBackgroundMusic() {
            if (isMuted) return;
            bgAudio.volume = 1.0;
            const playPromise = bgAudio.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.log("تنبيه تشغيل الصوت:", err);
                    document.getElementById('filePickerLabel').classList.remove('hidden');
                });
            }
        }

        function loadCustomAudio(input) {
            if (input.files && input.files[0]) {
                const fileURL = URL.createObjectURL(input.files[0]);
                bgAudio.src = fileURL;
                bgAudio.load();
                if (!isMuted) bgAudio.play();
                document.getElementById('filePickerLabel').classList.add('hidden');
            }
        }

        const teams = [
            'فريق الصقور 🦅', 'فريق الأسود 🦁', 'فريق النمور 🐅',
            'فريق الفهود 🐆', 'فريق الذئاب 🐺', 'فريق الفرسان 🐎'
        ];

        let rotation = 0; 
        let isSpinning = false;
        let state = { qList: [], currentQ: null, scores: [0,0,0,0,0,0], turn: 0, qCount: 0, timer: null };

        const colors = ['#047857', '#b91c1c', '#d97706', '#0f766e', '#854d0e', '#15803d', '#991b1b', '#0369a1'];

        // الأسئلة (استخدم مصفوفة الأسئلة الموجودة لديك مسبقاً هنا)
        const questions = [
            // ... (احتفظ بنفس مصفوفة الأسئلة الخاصة بك هنا) ...
        ];

        window.onload = () => {
            const svgSegments = document.getElementById('wheelSegments');
            const count = 8; 
            const slice = 360 / count;

            for(let i=0; i<count; i++) {
                const start = i * slice; 
                const end = (i+1) * slice;
                
                const x1 = 200 + 198 * Math.cos(Math.PI * (start-90)/180); 
                const y1 = 200 + 198 * Math.sin(Math.PI * (start-90)/180);
                const x2 = 200 + 198 * Math.cos(Math.PI * (end-90)/180); 
                const y2 = 200 + 198 * Math.sin(Math.PI * (end-90)/180);
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M 200 200 L ${x1} ${y1} A 198 198 0 0 1 ${x2} ${y2} Z`);
                path.setAttribute("fill", colors[i]);
                svgSegments.appendChild(path);
            }
            
            // تجهيز الأسئلة بترتيب عشوائي
            if (questions && questions.length > 0) {
                state.qList = [...questions].sort(() => Math.random() - 0.5);
            }
        };

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            playBackgroundMusic();
            updateScoreboard();
        }

        function updateScoreboard() {
            const board = document.getElementById('scoreboard');
            board.innerHTML = '';
            teams.forEach((t, i) => {
                board.innerHTML += `
                <div class="flex justify-between items-center text-sm md:text-base border-b border-white/10 pb-1 mb-1">
                    <span class="text-white">${t}</span>
                    <span class="text-yellow-400 font-bold">${state.scores[i]} نقطة</span>
                </div>`;
            });
            document.getElementById('currentTeamName').innerText = teams[state.turn];
        }

        function toggleMute() {
            isMuted = !isMuted;
            bgAudio.muted = isMuted;
            document.getElementById('muteBtn').innerText = isMuted ? '🔇' : '🔊';
        }

        function confirmGoHome() {
            if(confirm('هل أنت متأكد من العودة للرئيسية والبدء من جديد؟')) {
                location.reload();
            }
        }

        function triggerSpin() {
            if(isSpinning) return;
            isSpinning = true;
            
            if(!isMuted) sfx.spin.play().catch(e => console.log("الصوت غير متوفر"));
            
            const spins = Math.floor(Math.random() * 5) + 5; 
            const degree = Math.floor(Math.random() * 360);
            rotation += (spins * 360) + degree;
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${rotation}deg)`;
            
            setTimeout(() => {
                isSpinning = false;
                document.getElementById('wheelSection').classList.add('hidden');
                
                const qSection = document.getElementById('questionSection');
                qSection.classList.remove('hidden');
                qSection.classList.add('flex');
                
                showQuestion();
            }, 4000); // يتزامن مع مدة انتقال CSS
        }

        function showQuestion() {
            if(state.qCount >= 30 || state.qList.length === 0) {
                endGame();
                return;
            }
            
            document.getElementById('qNum').innerText = (state.qCount + 1);
            state.currentQ = state.qList.pop();
            document.getElementById('qText').innerText = state.currentQ.q;
            
            const visualBox = document.getElementById('qVisual');
            if(state.currentQ.visual) {
                visualBox.innerHTML = state.currentQ.visual;
                visualBox.classList.remove('hidden');
            } else {
                visualBox.innerHTML = '';
                visualBox.classList.add('hidden');
            }
            
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            
            let opts = state.currentQ.o.map((text, index) => ({ text, isCorrect: index === state.currentQ.a }));
            opts = opts.sort(() => Math.random() - 0.5);
            
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => handleAnswer(btn, opt.isCorrect);
                optionsGrid.appendChild(btn);
            });
            
            document.getElementById('nextBtn').classList.add('hidden');
            
            let timeLeft = 60;
            document.getElementById('timer').innerText = timeLeft;
            clearInterval(state.timer);
            state.timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(state.timer);
                    disableOptions();
                    document.getElementById('nextBtn').classList.remove('hidden');
                }
            }, 1000);
        }

        function handleAnswer(btn, isCorrect) {
            clearInterval(state.timer);
            disableOptions();
            
            if(isCorrect) {
                btn.classList.add('correct');
                if(!isMuted) sfx.correct.play().catch(e => {});
                state.scores[state.turn] += 10;
            } else {
                btn.classList.add('wrong');
                if(!isMuted) sfx.wrong.play().catch(e => {});
                
                // إظهار الإجابة الصحيحة
                const buttons = document.getElementById('optionsGrid').children;
                for(let b of buttons) {
                    if(b.innerText === state.currentQ.o[state.currentQ.a]) {
                        b.classList.add('correct');
                    }
                }
            }
            
            updateScoreboard();
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function disableOptions() {
            const buttons = document.getElementById('optionsGrid').children;
            for(let b of buttons) {
                b.disabled = true;
                b.style.pointerEvents = 'none';
            }
        }

        function resolveAnswer() {
            state.qCount++;
            state.turn = (state.turn + 1) % teams.length;
            
            document.getElementById('questionSection').classList.add('hidden');
            document.getElementById('questionSection').classList.remove('flex');
            document.getElementById('wheelSection').classList.remove('hidden');
            updateScoreboard();
        }

        function endGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            
            const finalRanking = document.getElementById('finalRanking');
            finalRanking.innerHTML = '';
            
            const sortedTeams = teams.map((t, i) => ({name: t, score: state.scores[i]})).sort((a,b) => b.score - a.score);
            
            sortedTeams.forEach((t, i) => {
                finalRanking.innerHTML += `
                <div class="text-xl md:text-2xl text-white mb-3">
                    ${i+1}. ${t.name} - <span class="text-yellow-400 font-bold">${t.score} نقطة</span>
                </div>`;
            });
        }

        function resetToHome() {
            location.reload();
        }
    </script>
